<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breeze Easy for Kids</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dragon-breath.css">
    <link rel="stylesheet" href="css/racecar-scene-v4.css">
</head>
<body>
<main id="app">

    <!-- =====================================================
         MAIN MENU SCREEN
         ===================================================== -->

    <section id="menu-screen" class="screen active-screen">

        <div class="sky-background" aria-hidden="true"></div>

        <!-- Poof Character -->
        <div id="poof-container" role="img" aria-label="Poof, a friendly blue dragon sitting on a cloud">
            <div class="poof-character">

                <img class="poof-layer poof-seat-cloud" src="images/poof/poof-seat-cloud-v1.png" alt="">
                <img class="poof-layer poof-tail" id="poof-tail" src="images/poof/poof-tail-1.png" alt="">

                <img class="poof-layer poof-left-wing" src="images/poof/poof-left-wing.png" alt="">
                <img class="poof-layer poof-right-wing" src="images/poof/poof-right-wing.png" alt="">

                <img class="poof-layer poof-body" src="images/poof/poof-body-balanced-v1.png" alt="">
                <img class="poof-layer poof-head" src="images/poof/poof-head.png" alt="">

                <img class="poof-layer poof-left-ear" src="images/poof/poof-left-ear.png" alt="">
                <img class="poof-layer poof-right-ear" src="images/poof/poof-right-ear.png" alt="">

                <img class="poof-layer poof-left-eye" id="poof-left-eye" src="images/poof/poof-left-eye-open.png" alt="">
                <img class="poof-layer poof-right-eye" id="poof-right-eye" src="images/poof/poof-right-eye-open.png" alt="">

                <img class="poof-layer poof-nose" src="images/poof/poof-nose.png" alt="">
                <img class="poof-layer poof-mouth" src="images/poof/poof-mouth.png" alt="">
                <img class="poof-layer poof-sparkle" src="images/poof/poof-sparkle.png" alt="">

            </div>
        </div>

        <!-- =====================================================
             ACTIVITY GRID
             ===================================================== -->

        <section class="activity-grid" aria-label="Activities">

            <button class="activity-card" data-activity="bubbles">
                <img src="images/activities/bubbles-poof-v1.webp" alt="Bubbles" width="768" height="768" decoding="async">
            </button>

            <button class="activity-card" data-activity="racecar">
                <img src="images/activities/racecar-poof-v1.webp" alt="Racecar" width="768" height="768" decoding="async">
            </button>

            <button class="activity-card" data-activity="dragon">
                <img src="images/activities/dragon-breath-purple-v3.png" alt="Dragon Breath" width="768" height="768" decoding="async">
            </button>

            <button class="activity-card" data-activity="balloon">
                <img src="images/activities/balloon-poof-v1.webp" alt="Balloon" width="768" height="768" decoding="async">
            </button>

        </section>

    </section>

    <!-- =====================================================
         ACTIVITY SCREEN
         ===================================================== -->

    <section id="activity-screen" class="screen">

        <!-- Back Button -->
        <button id="back-button">
            ← Back
        </button>

        <!-- Main Activity Area -->
        <div id="activity-area">

            <!-- Dynamic activity content loads here -->
        </div>

        <!-- =====================================================
             VERTICAL BLOW METER
             ===================================================== -->

        <div id="blow-meter">

            <div class="meter-dot"></div>
            <div class="meter-dot"></div>
            <div class="meter-dot"></div>
            <div class="meter-dot"></div>
            <div class="meter-dot"></div>

        </div>

        <!-- =====================================================
             POOF DURING ACTIVITIES
             ===================================================== -->

        <div id="activity-poof">

            <div class="poof-character poof-character-small">
                <img class="poof-layer poof-seat-cloud" src="images/poof/poof-seat-cloud-v1.png" alt="">
                <img class="poof-layer poof-tail animated-tail" src="images/poof/poof-tail-1.png" alt="">
                <img class="poof-layer poof-left-wing" src="images/poof/poof-left-wing.png" alt="">
                <img class="poof-layer poof-right-wing" src="images/poof/poof-right-wing.png" alt="">
                <img class="poof-layer poof-body" src="images/poof/poof-body-balanced-v1.png" alt="">
                <img class="poof-layer poof-left-ear" src="images/poof/poof-left-ear.png" alt="">
                <img class="poof-layer poof-right-ear" src="images/poof/poof-right-ear.png" alt="">
                <img class="poof-layer poof-head" src="images/poof/poof-head.png" alt="">
                <img class="poof-layer poof-left-eye animated-left-eye" src="images/poof/poof-left-eye-open.png" alt="">
                <img class="poof-layer poof-right-eye animated-right-eye" src="images/poof/poof-right-eye-open.png" alt="">
                <img class="poof-layer poof-mouth" src="images/poof/poof-mouth.png" alt="">
                <img class="poof-layer poof-nose" src="images/poof/poof-nose.png" alt="">
                <img class="poof-layer poof-sparkle" src="images/poof/poof-sparkle.png" alt="">
            </div>

        </div>

        <!-- =====================================================
             TEST BLOW BUTTON
             DEVELOPMENT ONLY
             ===================================================== -->

        <button id="test-blow">
            Test Blow
        </button>

    </section>

    <!-- =====================================================
         CELEBRATION SCREEN
         ===================================================== -->

    <section id="celebration-screen" class="screen">

        <div id="celebration-content">

            <h2 id="celebration-message">
                You Did It!
            </h2>

            <div id="celebration-poof">

                <div class="poof-character poof-character-large">
                    <img class="poof-layer poof-seat-cloud" src="images/poof/poof-seat-cloud-v1.png" alt="">
                    <img class="poof-layer poof-tail animated-tail" src="images/poof/poof-tail-1.png" alt="">
                    <img class="poof-layer poof-left-wing" src="images/poof/poof-left-wing.png" alt="">
                    <img class="poof-layer poof-right-wing" src="images/poof/poof-right-wing.png" alt="">
                    <img class="poof-layer poof-body" src="images/poof/poof-body-balanced-v1.png" alt="">
                    <img class="poof-layer poof-left-ear" src="images/poof/poof-left-ear.png" alt="">
                    <img class="poof-layer poof-right-ear" src="images/poof/poof-right-ear.png" alt="">
                    <img class="poof-layer poof-head" src="images/poof/poof-head.png" alt="">
                    <img class="poof-layer poof-left-eye animated-left-eye" src="images/poof/poof-left-eye-open.png" alt="">
                    <img class="poof-layer poof-right-eye animated-right-eye" src="images/poof/poof-right-eye-open.png" alt="">
                    <img class="poof-layer poof-mouth" src="images/poof/poof-mouth.png" alt="">
                    <img class="poof-layer poof-nose" src="images/poof/poof-nose.png" alt="">
                    <img class="poof-layer poof-sparkle" src="images/poof/poof-sparkle.png" alt="">
                </div>

            </div>

        </div>

    </section>

    <!-- Parent Settings: hold to open, with visible feedback. -->
    <button id="settings-trigger" type="button" aria-label="Parent Settings (hold for 3 seconds)">
        <span class="settings-cloud" aria-hidden="true">☁️</span>
        <span class="settings-hold-label">Hold 3s</span>
        <span class="settings-hold-track" aria-hidden="true"><span></span></span>
    </button>

    <p id="blowing-help" role="status" hidden>Calibrate Blowing in Parent Settings</p>

</main>

<!-- =====================================================
     PARENT SETTINGS MODAL
     ===================================================== -->

<div id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">

    <div class="settings-panel">

        <h2 id="settings-title">Parent Settings</h2>

        <label>
            <input
                    type="checkbox"
                    id="sound-toggle"
                    checked
            >
            Sounds
        </label>

        <label>
            <input
                    type="checkbox"
                    id="voice-toggle"
                    checked
            >
            Voice
        </label>

        <label>
            <input
                    type="checkbox"
                    id="motion-toggle"
                    checked
            >
            Motion
        </label>

        <section class="calibration-controls" aria-labelledby="calibration-title">
            <h3 id="calibration-title">Blowing</h3>
            <button id="calibrate-blowing" type="button">Calibrate Blowing</button>
            <p id="calibration-status" role="status"></p>
            <details class="calibration-advanced">
                <summary>Advanced</summary>
                <div class="calibration-controls">
                    <label for="blow-sensitivity">Sensitivity: <output id="sensitivity-value" for="blow-sensitivity">50%</output></label>
                    <input id="blow-sensitivity" type="range" min="0" max="100" step="1" value="50" aria-describedby="sensitivity-help">
                    <p id="sensitivity-help">Less sensitive ← → More sensitive</p>
                    <p id="microphone-status" role="status">Microphone not started.</p>
                    <button id="enable-microphone" type="button">Retry Microphone</button>
                    <label for="microphone-level">Microphone level</label>
                    <meter id="microphone-level" min="0" max="255" value="0">0</meter>
                    <p id="blow-test-status" role="status">Blow to test.</p>
                    <button id="reset-calibration" type="button">Restore Defaults</button>
                </div>
            </details>
        </section>

        <button id="close-settings">
            Close
        </button>

    </div>

</div>

<dialog id="calibration-dialog" aria-labelledby="calibration-step-title" aria-describedby="calibration-step-hint">
    <div class="calibration-step">
        <div id="calibration-spinner" class="calibration-spinner" aria-hidden="true"></div>
        <div id="calibration-complete" class="calibration-complete" aria-hidden="true" hidden>✓</div>
        <h2 id="calibration-step-title" role="status" aria-live="polite" tabindex="-1">Quiet Please</h2>
        <p id="calibration-step-hint"></p>
        <div id="calibration-countdown" role="status" aria-live="assertive" hidden>3</div>
        <progress id="calibration-progress" max="100" value="0" aria-label="Blowing sample progress" hidden></progress>
        <button id="calibration-action" type="button" hidden>Ready to Blow?</button>
        <button id="cancel-calibration" class="calibration-cancel" type="button">Cancel</button>
        <details id="calibration-diagnostics" hidden>
            <summary>Calibration Details</summary>
            <pre id="calibration-diagnostics-text"></pre>
            <button id="copy-calibration-diagnostics" type="button">Copy Diagnostics</button>
            <p id="calibration-copy-status" role="status"></p>
        </details>
    </div>
</dialog>

<!-- =====================================================
     MAIN JAVASCRIPT
     ===================================================== -->

<script src="js/activities.js"></script>
<script src="js/blow-detection.js"></script>
<script src="js/microphone.js"></script>
<script src="js/calibration.js"></script>
<script src="js/poof.js"></script>
<script src="js/parent-guidance.js"></script>
<script src="js/app.js"></script>

</body>
</html>
